<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VaakSetu — AI-powered multilingual voice clinical intake assistant for healthcare workers in India.">
    <title>{% block title %}VaakSetu{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Socket.IO client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- ── Navbar ─────────────────────────────────────── -->
    <nav class="navbar" id="main-navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand" id="nav-brand">
                <span class="brand-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </span>
                <span class="brand-text">VaakSetu</span>
            </a>

            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>

            <ul class="nav-links" id="nav-links">
                <li><a href="/" class="nav-link {% block nav_home %}{% endblock %}" id="nav-home">Home</a></li>
                <li><a href="/intake" class="nav-link {% block nav_intake %}{% endblock %}" id="nav-intake">Intake</a></li>
                <li><a href="/history" class="nav-link {% block nav_history %}{% endblock %}" id="nav-history">History</a></li>
            </ul>
        </div>
    </nav>

    <!-- ── Toast Container ────────────────────────────── -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ── Main Content ──────────────────────────────── -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ── Footer ─────────────────────────────────────── -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <span class="brand-icon-sm">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    </svg>
                </span>
                <span>VaakSetu</span>
            </div>
            <p class="footer-tagline">AI-powered voice clinical intake for India</p>
            <p class="footer-copy">&copy; 2026 VaakSetu. Built for healthcare.</p>
        </div>
    </footer>

    <!-- ── Scripts ─────────────────────────────────────── -->
    <script>
        // Mobile nav toggle
        document.getElementById('nav-toggle')?.addEventListener('click', () => {
            document.getElementById('nav-links')?.classList.toggle('open');
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
