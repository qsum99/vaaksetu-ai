{% extends "base.html" %}
{% block title %}VaakSetu — Clinical Report{% endblock %}

{% block content %}
<section class="report-section">
    <div class="report-container">
        <!-- Header -->
        <div class="report-header">
            <div class="report-header-left">
                <a href="/history" class="back-link" id="report-back-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Back
                </a>
                <h1 class="page-title">Clinical <span class="gradient-text">Report</span></h1>
            </div>
            <div class="report-actions">
                <button class="btn btn-outline btn-sm" id="play-tts-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                    Play Summary
                </button>
                <button class="btn btn-outline btn-sm" onclick="window.print()" id="print-report-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 6 2 18 2 18 9"/>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                        <rect x="6" y="14" width="12" height="8"/>
                    </svg>
                    Print
                </button>
            </div>
        </div>

        <!-- Report Body -->
        <div class="report-body">
            <!-- Demographics -->
            <div class="glass-card report-card" id="demographics-card">
                <h3 class="report-card-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Patient Demographics
                </h3>
                <div class="report-grid-4">
                    <div class="report-field">
                        <label class="report-label">Full Name</label>
                        <input type="text" class="form-input" id="rep-name">
                    </div>
                    <div class="report-field">
                        <label class="report-label">Age</label>
                        <input type="number" class="form-input" id="rep-age">
                    </div>
                    <div class="report-field">
                        <label class="report-label">Gender</label>
                        <input type="text" class="form-input" id="rep-gender">
                    </div>
                    <div class="report-field">
                        <label class="report-label">Village</label>
                        <input type="text" class="form-input" id="rep-village">
                    </div>
                </div>
            </div>

            <!-- Clinical Details -->
            <div class="glass-card report-card" id="clinical-card">
                <h3 class="report-card-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                    Clinical Details
                </h3>
                <div class="report-grid-2">
                    <div class="report-field">
                        <label class="report-label">Chief Complaint</label>
                        <textarea class="form-input form-textarea" id="rep-complaint" rows="2"></textarea>
                    </div>
                    <div class="report-field">
                        <label class="report-label">Symptoms</label>
                        <div class="report-symptoms" id="rep-symptoms-tags"></div>
                        <textarea class="form-input form-textarea" id="rep-symptoms" rows="2" style="display:none"></textarea>
                    </div>
                </div>
                <div class="report-grid-3">
                    <div class="report-field">
                        <label class="report-label">Duration</label>
                        <input type="text" class="form-input" id="rep-duration">
                    </div>
                    <div class="report-field">
                        <label class="report-label">Vitals</label>
                        <input type="text" class="form-input" id="rep-vitals">
                    </div>
                    <div class="report-field">
                        <label class="report-label">Follow-up Date</label>
                        <input type="date" class="form-input" id="rep-followup">
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div class="glass-card report-card" id="notes-card">
                <h3 class="report-card-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                    Medical Notes
                </h3>
                <div class="report-grid-2">
                    <div class="report-field">
                        <label class="report-label">Medical History</label>
                        <textarea class="form-input form-textarea" id="rep-history" rows="3"></textarea>
                    </div>
                    <div class="report-field">
                        <label class="report-label">Diagnosis Notes</label>
                        <textarea class="form-input form-textarea" id="rep-notes" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <!-- Save -->
            <div class="report-save-bar">
                <button class="btn btn-primary btn-glow" id="save-history-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save to History
                </button>
            </div>
        </div>
    </div>
</section>

<!-- Hidden audio player -->
<audio id="audio-player" style="display:none"></audio>
{% endblock %}

{% block scripts %}
<script src="/static/js/apiClient.js"></script>
<script src="/static/js/ttsPlayer.js"></script>
<script src="/static/js/app.js"></script>
{% endblock %}
