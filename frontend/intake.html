<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaakSetu - Clinical Intake</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">VaakSetu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="intake.html">Intake</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0">Live Voice Intake</h2>
            <span id="ws-status" class="badge bg-secondary p-2 shadow-sm rounded-pill">Connecting...</span>
        </div>

        <div class="row g-4">
            <!-- Left Column: Audio and Transcript -->
            <div class="col-md-7">
                <div class="glass-card p-4 text-center mb-4">
                    <button id="record-btn" class="record-btn">
                        <!-- Simple SVG mic icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-mic-fill" viewBox="0 0 16 16">
                            <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0V3z"/>
                            <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5z"/>
                        </svg>
                    </button>
                    <p class="mt-3 text-muted fw-semibold" id="record-status-text">Tap to Start Recording</p>
                </div>

                <div class="glass-card p-4 mb-4">
                    <h5 class="fw-bold mb-3">Live Transcript</h5>
                    <div id="transcript-box" class="transcript-box">
                        <!-- Transcript entries will appear here -->
                    </div>
                </div>

                <div class="glass-card p-4 followup-card shadow-sm">
                    <h5 class="fw-bold text-warning mb-2">AI Follow-up Question</h5>
                    <p id="followup-text" class="m-0 fs-5">Listening for context...</p>
                </div>
            </div>

            <!-- Right Column: Extracted Entities -->
            <div class="col-md-5">
                <div class="glass-card p-4 h-100 d-flex flex-column">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">Patient Details</h5>
                    <form id="extraction-form" class="mb-4 flex-grow-1">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Name</label>
                            <input type="text" class="form-control" id="form-name">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Age</label>
                                <input type="number" class="form-control" id="form-age">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Gender</label>
                                <input type="text" class="form-control" id="form-gender">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Village</label>
                            <input type="text" class="form-control" id="form-village">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Detected Symptoms</label>
                            <div id="symptoms-container" class="d-flex flex-wrap gap-2 mt-2">
                                <!-- Badges get appended here -->
                            </div>
                        </div>
                    </form>
                    
                    <button class="btn btn-primary w-100 rounded-pill py-2 shadow" id="generate-report-btn">
                        Generate Report
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/audioRecorder.js"></script>
    <script src="js/wsClient.js"></script>
    <script src="js/apiClient.js"></script>
    <script src="js/ttsPlayer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
